<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset="0.5" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>

    <!-- Main text -->
    <linearGradient id="title" x1="250" y1="130" x2="850" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="glowBlue" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#38BDF8" stroke-opacity="0.06"/>
    </pattern>

    <!-- Circle gradient -->
    <radialGradient id="blueGlow">
      <stop stop-color="#38BDF8" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="purpleGlow">
      <stop stop-color="#A855F7" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" rx="24" fill="url(#bg)"/>

  <!-- Grid -->
  <rect width="1200" height="400" rx="24" fill="url(#grid)"/>

  <!-- Ambient glow -->
  <circle cx="150" cy="80" r="280" fill="url(#blueGlow)"/>
  <circle cx="1080" cy="330" r="300" fill="url(#purpleGlow)"/>

  <!-- Decorative circuit lines -->
  <g stroke="#38BDF8" stroke-opacity="0.25" stroke-width="1.5">
    <path d="M0 85H120L145 110H210"/>
    <path d="M990 75H1080L1110 105H1200"/>
    <path d="M0 330H100L130 300H190"/>
    <path d="M1010 320H1080L1110 290H1200"/>
  </g>

  <!-- Circuit nodes -->
  <g fill="#38BDF8" filter="url(#glowBlue)">
    <circle cx="120" cy="85" r="4"/>
    <circle cx="210" cy="110" r="4"/>
    <circle cx="1080" cy="75" r="4"/>
    <circle cx="1110" cy="105" r="4"/>
    <circle cx="100" cy="330" r="4"/>
    <circle cx="190" cy="300" r="4"/>
    <circle cx="1080" cy="320" r="4"/>
  </g>

  <!-- QA shield / check icon -->
  <g transform="translate(90 125)">
    <path
      d="M75 0L140 24V75C140 125 110 157 75 175C40 157 10 125 10 75V24L75 0Z"
      fill="#0F172A"
      stroke="#38BDF8"
      stroke-width="3"
    />

    <path
      d="M42 83L64 105L108 57"
      stroke="#38BDF8"
      stroke-width="10"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <circle
      cx="75"
      cy="85"
      r="92"
      stroke="#38BDF8"
      stroke-opacity="0.12"
      stroke-width="2"
    />
  </g>

  <!-- Main heading -->
  <text
    x="270"
    y="130"
    fill="#94A3B8"
    font-family="Arial, Helvetica, sans-serif"
    font-size="18"
    font-weight="700"
    letter-spacing="4">
    QUALITY ASSURANCE ENGINEER
  </text>

  <text
    x="265"
    y="200"
    fill="url(#title)"
    font-family="Arial, Helvetica, sans-serif"
    font-size="64"
    font-weight="800">
    Santhosh AR
  </text>

  <!-- Subtitle -->
  <text
    x="270"
    y="240"
    fill="#CBD5E1"
    font-family="Arial, Helvetica, sans-serif"
    font-size="19">
    Manual Testing • Automation • API Testing • SQL • ETL Testing
  </text>

  <!-- Status -->
  <g transform="translate(270 270)">
    <circle cx="8" cy="8" r="6" fill="#22C55E"/>
    <text
      x="24"
      y="14"
      fill="#94A3B8"
      font-family="Arial, Helvetica, sans-serif"
      font-size="14">
      TESTING SOFTWARE • FINDING BUGS • IMPROVING QUALITY
    </text>
  </g>

  <!-- Skill pills -->
  <g transform="translate(270 315)" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600">

    <!-- Selenium -->
    <rect width="105" height="34" rx="17" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.45"/>
    <text x="18" y="22" fill="#BAE6FD">Selenium</text>

    <!-- Java -->
    <rect x="115" width="75" height="34" rx="17" fill="#0F172A" stroke="#818CF8" stroke-opacity="0.45"/>
    <text x="137" y="22" fill="#C7D2FE">Java</text>

    <!-- API -->
    <rect x="200" width="90" height="34" rx="17" fill="#0F172A" stroke="#C084FC" stroke-opacity="0.45"/>
    <text x="222" y="22" fill="#E9D5FF">API</text>

    <!-- SQL -->
    <rect x="300" width="75" height="34" rx="17" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.45"/>
    <text x="323" y="22" fill="#BAE6FD">SQL</text>

    <!-- TestNG -->
    <rect x="385" width="95" height="34" rx="17" fill="#0F172A" stroke="#818CF8" stroke-opacity="0.45"/>
    <text x="405" y="22" fill="#C7D2FE">TestNG</text>

    <!-- Git -->
    <rect x="490" width="70" height="34" rx="17" fill="#0F172A" stroke="#C084FC" stroke-opacity="0.45"/>
    <text x="512" y="22" fill="#E9D5FF">Git</text>

  </g>

  <!-- Right-side mini terminal -->
  <g transform="translate(875 135)">

    <rect
      width="235"
      height="145"
      rx="14"
      fill="#020617"
      stroke="#334155"
      stroke-width="1.5"
    />

    <!-- Terminal header -->
    <circle cx="18" cy="18" r="5" fill="#64748B"/>
    <circle cx="36" cy="18" r="5" fill="#64748B"/>
    <circle cx="54" cy="18" r="5" fill="#64748B"/>

    <!-- Terminal text -->
    <text
      x="20"
      y="55"
      fill="#38BDF8"
      font-family="monospace"
      font-size="12">
      $ run-tests
    </text>

    <text
      x="20"
      y="78"
      fill="#94A3B8"
      font-family="monospace"
      font-size="11">
      ✓ Functional
    </text>

    <text
      x="20"
      y="98"
      fill="#94A3B8"
      font-family="monospace"
      font-size="11">
      ✓ Regression
    </text>

    <text
      x="20"
      y="118"
      fill="#94A3B8"
      font-family="monospace"
      font-size="11">
      ✓ API Validation
    </text>

    <text
      x="20"
      y="138"
      fill="#22C55E"
      font-family="monospace"
      font-size="11">
      ✓ All checks passed
    </text>

  </g>

  <!-- Bottom accent -->
  <rect x="0" y="397" width="1200" height="3" fill="#38BDF8"/>

</svg>
